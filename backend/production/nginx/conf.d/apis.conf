server {
    listen 80;
    server_name api-portfolio-aijing.aijing.li
                api-portfolio-fedi.aijing.li
                api-portfolio-azer.aijing.li;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-portfolio-aijing.aijing.li;

    ssl_certificate /etc/letsencrypt/live/portfolio-apis/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portfolio-apis/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://strapi_a:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

