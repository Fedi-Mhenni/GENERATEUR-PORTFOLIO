services:
  strapi:
    build: ./app
    container_name: strapi_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_HOST: postgres_db
    ports:
      - "1337:1337"
    volumes:
      - ./app:/app
      - /app/node_modules
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres_db:
        condition: service_healthy

  postgres_db:
    image: postgres:17-alpine
    container_name: strapi_postgres
    restart: unless-stopped
    # Source unique de vérité : les variables DATABASE_* de .env (convention Strapi)
    # sont mappées ici vers les variables POSTGRES_* attendues par l'image Postgres.
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DATABASE_HOST_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  strapi_uploads: