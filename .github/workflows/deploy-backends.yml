name: Deploy backends

on:
  push:
    branches: [main]
    paths:
      - "backend/app/**"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-backends
  cancel-in-progress: false

jobs:
  publish-image:
    name: Build and publish Strapi image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Check out merged commit
        uses: actions/checkout@v4

      - name: Define image repository
        id: image
        shell: bash
        run: |
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: backend/app
          file: backend/app/Dockerfile.prod
          push: true
          tags: ${{ steps.image.outputs.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy three Strapi services sequentially
    needs: publish-image
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_PRIVATE_KEY_B64: ${{ secrets.VPS_SSH_PRIVATE_KEY_B64 }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s' "$VPS_SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy the commit image on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          IMAGE_TAG: ${{ needs.publish-image.outputs.image_tag }}
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -p "$VPS_PORT" \
            "deploy@$VPS_HOST" \
            "sudo /opt/generateur-portfolio/backend/production/scripts/deploy-backends.sh deploy '$IMAGE_TAG'"
